name: Lean Proof CI
on:
  push:
    branches: [ main ]
    paths:
      - '**.lean'
      - 'lean-toolchain'
  pull_request:
    branches: [ main ]
    paths:
      - '**.lean'
      - 'lean-toolchain'

jobs:
  verify-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Verify Formal Proof Codebase
        uses: leanprover/lean-action@v1
