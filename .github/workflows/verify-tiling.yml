name: Verify Spectre Delta Boundary Proof

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Python Integration Tests
      run: |
        python3 test_solver_integration.py

    - name: Generate and Verify Lean Peeling Certificate
      run: |
        python3 spectre_patch_solver.py -t Delta -g 2 --cert --lean-out /tmp/CertificateData.lean
        diff -u ./SpectreDeltaBoundary/CertificateData.lean /tmp/CertificateData.lean

    - name: Build and Verify Lean Uniqueness Proof
      uses: leanprover/lean-action@v1
